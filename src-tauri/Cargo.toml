[package]
name = "snagcraft"
version = "1.5.4"
description = "Open-source Snagit-style screen capture and annotation"
authors = ["rostad"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "snagcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# tray-icon's default Linux backend (libappindicator) emits NO mouse events.
# The ksni backend speaks StatusNotifierItem natively and DOES emit left/middle
# clicks — that is what makes click/double-click-to-restore work on KDE Wayland.
# Feature unification with tauri's own tray-icon dependency switches the backend.
# default-features = false is LOAD-BEARING: the defaults add muda-libxdo, which
# links libxdo.so.3 — an X11 library absent on many Wayland desktops. The thin
# AppImage (system libraries) then fails to start with a loader error.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
webp = "0.3"
arboard = { version = "3", features = ["wayland-data-control"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["screenshot", "global_shortcuts", "screencast", "tokio"] }
pipewire = { version = "0.10", features = ["v0_3_34"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9"
# Native global hotkeys on Windows/macOS (RegisterHotKey / Carbon). Linux uses
# the GlobalShortcuts portal instead — this plugin is X11-only there.
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
