name: build

# Builds a Linux AppImage/.deb and a Windows NSIS installer.
# Trigger manually (workflow_dispatch) or on a version tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Lint + tests gate the release: nothing ships unless rustfmt, clippy and the
  # unit tests are clean.
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install Tauri + PipeWire build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev
          GCC_INC=$(ls -d /usr/lib/gcc/x86_64-linux-gnu/*/include | head -1)
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$GCC_INC" >> "$GITHUB_ENV"

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  linux:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri + PipeWire build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev
          # libspa-sys bindgen needs the GCC include dir for stdbool.h
          GCC_INC=$(ls -d /usr/lib/gcc/x86_64-linux-gnu/*/include | head -1)
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$GCC_INC" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --bundles appimage,deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
          # Updater signing: the bundles get a .sig, which latest.json publishes.
          # Losing this key stops in-app updates for every installed copy.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Thin AppImage (system WebKitGTK, ~4 MB)
        run: |
          SRC=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name 'SnagCraft_*_amd64.AppImage' | head -1)
          ./scripts/thin-appimage.sh "$SRC" src-tauri/target/release/bundle/appimage

      - uses: actions/upload-artifact@v5
        with:
          name: snagcraft-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    needs: quality
    runs-on: windows-latest
    # The NSIS/WiX tooling download or a cargo step can hang on a bad runner —
    # bound the job so a stall fails in 40 min instead of burning the 6 h max.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Build Windows installer (NSIS + MSI)
        run: pnpm tauri build --bundles nsis,msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v5
        with:
          name: snagcraft-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # On a version tag, attach every installer to the GitHub release so the
  # release page carries Linux AND Windows assets (artifacts alone expire).
  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach installers to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          # Artifacts keep their bundle subdirs (appimage/, deb/, nsis/, msi/) —
          # upload the FILES, not the directories.
          find artifacts -type f -print0 | \
            xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber --repo "$GITHUB_REPOSITORY"

      # The in-app updater polls `releases/latest/download/latest.json`, so the
      # newest release must carry one. Signature = content of the .sig file.
      - name: Publish latest.json (in-app updater)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json body -q .body > release-notes.md
          python3 scripts/make-latest-json.py \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --artifacts artifacts \
            --out latest.json \
            --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" latest.json \
            --clobber --repo "$GITHUB_REPOSITORY"
