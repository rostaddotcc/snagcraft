name: ✨ Feature request
description: Suggest an improvement — describe the problem, not just the solution.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us about the **problem you hit** first — there may be a better fix than
        the one you imagined, or an existing feature you haven't found yet.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The workflow that's slow, missing or awkward today.
      placeholder: "I capture two monitors side by side and have to stitch them manually…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds, other tools, existing SnagCraft features you tried.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true